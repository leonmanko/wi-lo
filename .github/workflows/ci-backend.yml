name: CI - Backend 
 
on: 
  push: 
    branches: [main, develop] 
    paths: 
      - "server/**" 
  pull_request: 
    branches: [main] 
    paths: 
      - "server/**" 
 
jobs: 
  lint: 
    name: Lint et Format 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v7 
      - uses: actions/setup-node@v4 
        with: 
          node-version: 20 
      - run: cd server && npm install 
      - run: cd server && npx eslint src/ 
      - run: cd server && npx prettier --check src/ 
