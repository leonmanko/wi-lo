name: Deploy - Backend Staging 
 
on: 
  push: 
    branches: [develop] 
    paths: 
      - "server/**" 
 
jobs: 
  deploy: 
    name: Deployer sur Render (staging) 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v7 
      - name: Declencher deploy Render 
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }} 
